<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conversor de datos</title>

    <link rel="stylesheet" href="https://jorgerosa.dev/assets/css/jr-tools.css">
    <link rel="stylesheet" href="css/converter.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="js/CSVParser.js"></script>
    <script src="js/DataGridRenderer.js"></script>
    <script src="js/converter.js"></script>
    <script src="js/Controller.js"></script>
</head>

<body class="jr-page">

    <main id="base">

        <div class="jr-container converter-layout">

            <!-- Información y ajustes -->
            <aside id="header">

                <header class="jr-header" id="description">

                    <h1>Conversor de datos</h1>

                    <p>
                        Convierte los datos de Excel en formatos
                        amigables con la web como HTML, JSON y XML.
                    </p>

                </header>


                <section id="settings" class="jr-card">

                    <h2>Ajustes</h2>

                    <form id="settingsForm">

                        <fieldset class="settings-section">

                            <legend>Delimitador de campos</legend>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="delimiter"
                                    id="delimiterAuto"
                                    value="auto"
                                    checked
                                >
                                Auto
                            </label>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="delimiter"
                                    id="delimiterComma"
                                    value="comma"
                                >
                                Coma
                            </label>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="delimiter"
                                    id="delimiterTab"
                                    value="tab"
                                >
                                Tabulador
                            </label>

                        </fieldset>


                        <fieldset class="settings-section">

                            <legend>Signo decimal</legend>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="decimal"
                                    id="decimalDot"
                                    value="dot"
                                    checked
                                >
                                Punto
                            </label>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="decimal"
                                    id="decimalComma"
                                    value="comma"
                                >
                                Coma
                            </label>

                        </fieldset>


                        <label class="settings-check">

                            <input
                                class="jr-checkbox settingsElement"
                                type="checkbox"
                                id="headersProvidedCB"
                                checked
                            >

                            <span>Primera fila en la cabecera</span>

                        </label>


                        <fieldset class="settings-section settingsGroup">

                            <legend>Transformar cabeceras</legend>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="headerModifications"
                                    value="downcase"
                                    id="headersDowncase"
                                >
                                minúsculas
                            </label>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="headerModifications"
                                    id="headersUpcase"
                                    value="upcase"
                                >
                                mayúsculas
                            </label>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="headerModifications"
                                    id="headersNoTransform"
                                    value="none"
                                    checked
                                >
                                ninguno
                            </label>

                        </fieldset>


                        <label class="settings-check">

                            <input
                                class="jr-checkbox settingsElement"
                                type="checkbox"
                                name="some_name"
                                id="includeWhiteSpaceCB"
                                checked
                            >

                            <span>Incluir espacio en blanco a la salida</span>

                        </label>


                        <fieldset class="settings-section settingsGroup">

                            <legend>Indentar con</legend>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="indentType"
                                    value="tabs"
                                    id="includeWhiteSpaceTabs"
                                >
                                tabuladores
                            </label>

                            <label>
                                <input
                                    class="settingsElement"
                                    type="radio"
                                    name="indentType"
                                    value="spaces"
                                    id="includeWhiteSpaceSpaces"
                                    checked
                                >
                                espacios
                            </label>

                        </fieldset>

                    </form>


                    <div class="converter-logo">

                        <img
                            id="logo"
                            src="https://www.jorgerosa.dev/img/logo.png"
                            alt="JorgeRosa.dev"
                            width="100"
                        >

                    </div>

                </section>

            </aside>


            <!-- Conversor -->
            <section id="converter">

                <!-- El contenido lo generan los JS -->

            </section>

        </div>

    </main>

</body>
</html>
