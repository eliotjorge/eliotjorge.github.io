<body class="jr-page">

<h1 class="jr-header">Generador Playground Jekyll</h1>

<label>ID del ejemplo</label>
<input class="jr-input" id="id" placeholder="grid01">

<label>Altura</label>
<input id="height" value="250">

<label>HTML *</label>
<textarea id="html" class="jr-texarea"></textarea>

<label>CSS</label>
<textarea id="css" class="jr-texarea"></textarea>

<label>JavaScript</label>
<textarea id="js" class="jr-texarea"></textarea>

<div class="acciones">

    <button id="generar" class="jr-btn">
        📋 Generar y copiar
    </button>

    <button id="limpiar" class="jr-btn">
        🗑 Limpiar
    </button>

</div>

<pre id="resultado" class="jr-code"></pre>

<script>
document
.getElementById("generar")
.addEventListener("click", generar);

document
.getElementById("limpiar")
.addEventListener("click", limpiar);

function generar(){

    const boton=document.getElementById("generar");

    const id=document.getElementById("id").value.trim();
    const html=document.getElementById("html").value.trim();
    const css=document.getElementById("css").value.trim();
    const js=document.getElementById("js").value.trim();
    const height=document.getElementById("height").value.trim() || "250";

    if(id===""){

        alert("Debes indicar un ID.");

        return;

    }

    if(html===""){

        alert("El HTML es obligatorio.");

        return;

    }

    let salida="";

    salida+=`{% capture ${id}_html %}

${html}

{% endcapture %}

`;

    if(css!==""){

        salida+=`{% capture ${id}_css %}

${css}

{% endcapture %}

`;

    }

    if(js!==""){

        salida+=`{% capture ${id}_javascript %}

${js}

{% endcapture %}

`;

    }

    salida+=`{% include playground.html
id="${id}"
html=${id}_html`;

    if(css!==""){

        salida+=`
css=${id}_css`;

    }

    if(js!==""){

        salida+=`
javascript=${id}_javascript`;

    }

    salida+=`
height="${height}"
%}`;

    document.getElementById("resultado").textContent=salida;

    navigator.clipboard.writeText(salida);

    boton.textContent="✔ Copiado";

    boton.disabled=true;

    setTimeout(()=>{

        boton.textContent="📋 Generar y copiar";

        boton.disabled=false;

    },2000);

}

function limpiar(){

    document.getElementById("id").value="";
    document.getElementById("height").value="250";

    document.getElementById("html").value="";
    document.getElementById("css").value="";
    document.getElementById("js").value="";

    document.getElementById("resultado").textContent="";

    document.getElementById("id").focus();

}
</script>
