<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Content Explorer</title>

    <meta
        name="description"
        content="Extrae, busca y explora el contenido textual de cualquier página web."
    >

    <!-- JR Tools -->
    <link
        rel="stylesheet"
        href="https://jorgerosa.dev/assets/css/jr-tools.css"
    >

    <!-- Content Explorer -->
    <link
        rel="stylesheet"
        href="./content-explorer.css"
    >

</head>


<body class="jr-page">

    <main class="jr-container">


        <!-- ==================================================
                HEADER
        =================================================== -->

        <header class="jr-header">

            <h1>
                Content Explorer
            </h1>

            <p>
                Extrae y explora el contenido textual de una página web.
            </p>

        </header>


        <!-- ==================================================
                ANALYSIS
        =================================================== -->

        <section class="jr-card">

            <form id="explorer-form">

                <label
                    for="url"
                    class="jr-label"
                >
                    URL de la página

                    <input
                        type="url"
                        id="url"
                        name="url"
                        class="jr-input"
                        placeholder="https://ejemplo.com/"
                        required
                        autocomplete="url"
                    >

                </label>


                <div class="jr-buttons">

                    <button
                        type="submit"
                        id="analyze-button"
                        class="jr-btn"
                    >
                        Analizar página
                    </button>

                </div>

            </form>


            <!-- ============================================
                    PROGRESS
            ============================================= -->

            <div
                id="progress-container"
                class="ce-progress"
                hidden
            >

                <div class="jr-flex-between">

                    <span id="progress-text">
                        Analizando página...
                    </span>

                    <span id="progress-percent">
                        0%
                    </span>

                </div>

                <div class="ce-progress-track">

                    <div
                        id="progress-fill"
                        class="ce-progress-fill"
                    ></div>

                </div>

            </div>


            <!-- ============================================
                    ERROR
            ============================================= -->

            <div
                id="error"
                class="ce-alert ce-alert-error"
                hidden
            ></div>

        </section>


        <!-- ==================================================
                RESULTS
        =================================================== -->

        <section
            id="results"
            hidden
        >


            <!-- ============================================
                    PAGE INFORMATION
            ============================================= -->

            <section class="jr-card">

                <div class="jr-flex-between ce-results-title">

                    <div>

                        <h2>
                            Resultado
                        </h2>

                        <div
                            id="final-url"
                            class="ce-final-url"
                        ></div>

                    </div>

                    <span
                        id="result-count"
                        class="jr-badge jr-badge-success"
                    >
                        0 elementos
                    </span>

                </div>


                <!-- ========================================
                        STATISTICS
                ========================================= -->

                <div class="ce-statistics">


                    <div class="ce-stat">

                        <span
                            id="stat-total"
                            class="ce-stat-value"
                        >
                            0
                        </span>

                        <span class="ce-stat-label">
                            Elementos
                        </span>

                    </div>


                    <div class="ce-stat">

                        <span
                            id="stat-words"
                            class="ce-stat-value"
                        >
                            0
                        </span>

                        <span class="ce-stat-label">
                            Palabras
                        </span>

                    </div>


                    <div class="ce-stat">

                        <span
                            id="stat-characters"
                            class="ce-stat-value"
                        >
                            0
                        </span>

                        <span class="ce-stat-label">
                            Caracteres
                        </span>

                    </div>


                    <div class="ce-stat">

                        <span
                            id="stat-headings"
                            class="ce-stat-value"
                        >
                            0
                        </span>

                        <span class="ce-stat-label">
                            Headings
                        </span>

                    </div>


                </div>

            </section>


            <!-- ============================================
                    TITLE
            ============================================= -->

            <section class="jr-card">

                <h2>
                    Title
                </h2>

                <div
                    id="page-title"
                    class="ce-title-result"
                ></div>

            </section>


            <!-- ============================================
                    CONTENT
            ============================================= -->

            <section class="jr-card">

                <div class="jr-flex-between ce-content-header">

                    <h2>
                        Contenido
                    </h2>

                </div>


                <div id="content-results"></div>

            </section>


        </section>


    </main>


<script src="./content-explorer.js"></script>

</body>

</html>
