<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Content Explorer</title>

    <meta
        name="description"
        content="Extrae, busca y explora el contenido textual de cualquier página web."
    >

    <!-- JR Tools -->
    <link
        rel="stylesheet"
        href="https://jorgerosa.dev/assets/css/jr-tools.css"
    >

    <!-- Content Explorer -->
    <link
        rel="stylesheet"
        href="./content-explorer.css"
    >

</head>


<body class="jr-page">

    <main class="jr-container">


        <!-- ==================================================
                HEADER
        =================================================== -->

        <header class="jr-header">

            <h1>
                Content Explorer
            </h1>

            <p>
                Extrae y explora el contenido textual de una página web.
            </p>

        </header>


        <!-- ==================================================
                ANALYSIS
        =================================================== -->

        <section class="jr-card">

            <form id="explorer-form">

                <label
                    for="url"
                    class="jr-label"
                >
                    URL de la página

                    <input
                        type="url"
                        id="url"
                        name="url"
                        class="jr-input"
                        placeholder="https://ejemplo.com/"
                        required
                        autocomplete="url"
                    >

                </label>


                <div class="jr-buttons">

                    <button
                        type="submit"
                        id="analyze-button"
                        class="jr-btn"
                    >
                        Analizar página
                    </button>

                </div>

            </form>


            <!-- ==================================================
                EXTRACTION OPTIONS
            =================================================== -->

            <div class="ce-options">

                <h3>
                    Opciones de extracción
                </h3>

                <div class="ce-options-grid">

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="h1"
                            checked
                        >
                        <span>H1</span>
                    </label>

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="h2"
                            checked
                        >
                        <span>H2</span>
                    </label>

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="h3"
                            checked
                        >
                        <span>H3</span>
                    </label>

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="h4"
                            checked
                        >
                        <span>H4</span>
                    </label>

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="h5"
                            checked
                        >
                        <span>H5</span>
                    </label>

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="h6"
                            checked
                        >
                        <span>H6</span>
                    </label>

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="p"
                            checked
                        >
                        <span>Párrafos</span>
                    </label>

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="lists"
                            checked
                        >
                        <span>Listas</span>
                    </label>

                    <label class="ce-checkbox">
                        <input
                            type="checkbox"
                            name="tag"
                            value="blockquote"
                            checked
                        >
                        <span>Citas</span>
                    </label>

                </div>


                <div class="ce-options-extra">

                    <label class="ce-checkbox">

                        <input
                            type="checkbox"
                            id="ignore-short"
                        >

                        <span>
                            Ignorar textos de menos de
                        </span>

                        <input
                            type="number"
                            id="min-length"
                            class="jr-input ce-number-input"
                            value="20"
                            min="0"
                            max="1000"
                            disabled
                        >

                        <span>
                            caracteres
                        </span>

                    </label>


                    <label class="ce-checkbox">

                        <input
                            type="checkbox"
                            id="remove-duplicates"
                        >

                        <span>
                            Eliminar duplicados
                        </span>

                    </label>

                </div>

            </div>


            <!-- ============================================
                    PROGRESS
            ============================================= -->

            <div
                id="progress-container"
                class="ce-progress"
                hidden
            >

                <div class="jr-flex-between">

                    <span id="progress-text">
                        Analizando página...
                    </span>

                    <span id="progress-percent">
                        0%
                    </span>

                </div>

                <div class="ce-progress-track">

                    <div
                        id="progress-fill"
                        class="ce-progress-fill"
                    ></div>

                </div>

            </div>


            <!-- ============================================
                    ERROR
            ============================================= -->

            <div
                id="error"
                class="ce-alert ce-alert-error"
                hidden
            ></div>

        </section>


        <!-- ==================================================
                RESULTS
        =================================================== -->

        <section
            id="results"
            hidden
        >


            <!-- ============================================
                    PAGE INFORMATION
            ============================================= -->

            <section class="jr-card">

                <div class="jr-flex-between ce-results-title">

                    <div>

                        <h2>
                            Resultado
                        </h2>

                        <div
                            id="final-url"
                            class="ce-final-url"
                        ></div>

                    </div>

                    <span
                        id="result-count"
                        class="jr-badge jr-badge-success"
                    >
                        0 elementos
                    </span>

                </div>


                <!-- ========================================
                        STATISTICS
                ========================================= -->

                <div class="ce-statistics">


                    <div class="ce-stat">

                        <span
                            id="stat-total"
                            class="ce-stat-value"
                        >
                            0
                        </span>

                        <span class="ce-stat-label">
                            Elementos
                        </span>

                    </div>


                    <div class="ce-stat">

                        <span
                            id="stat-words"
                            class="ce-stat-value"
                        >
                            0
                        </span>

                        <span class="ce-stat-label">
                            Palabras
                        </span>

                    </div>


                    <div class="ce-stat">

                        <span
                            id="stat-characters"
                            class="ce-stat-value"
                        >
                            0
                        </span>

                        <span class="ce-stat-label">
                            Caracteres
                        </span>

                    </div>


                    <div class="ce-stat">

                        <span
                            id="stat-headings"
                            class="ce-stat-value"
                        >
                            0
                        </span>

                        <span class="ce-stat-label">
                            Headings
                        </span>

                    </div>


                </div>

            </section>


            <!-- ============================================
                    TITLE
            ============================================= -->

            <section class="jr-card">

                <h2>
                    Title
                </h2>

                <div
                    id="page-title"
                    class="ce-title-result"
                ></div>

            </section>


            <!-- ============================================
                    CONTENT
            ============================================= -->

            <section class="jr-card">

                <div class="jr-flex-between ce-content-header">

                    <h2>
                        Contenido
                    </h2>

                </div>


                <div id="content-results"></div>

            </section>


        </section>


    </main>


<script src="./content-explorer.js"></script>

</body>

</html>
